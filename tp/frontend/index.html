<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KrishiClear | Agricultural Clearinghouse &amp; Logistics Terminal</title>

  <meta name="description"
    content="Autonomous agricultural clearinghouse, perishability intelligence, and delivered economics for SIH 26033." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Google Translate -->
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js">
  </script>

  <style>
    /* Google Translate container */
    /* =========================================================
   GOOGLE TRANSLATE — NAVBAR LANGUAGE SELECTOR
   ========================================================= */

    #google_translate_element {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 82px !important;
      height: 32px !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      white-space: nowrap !important;
    }

    #google_translate_element .goog-te-gadget {
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      width: 100% !important;
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      font-size: 0 !important;
      color: transparent !important;
      font-family: 'Inter', sans-serif !important;
    }

    #google_translate_element .goog-te-gadget>span {
      display: none !important;
    }

    #google_translate_element .goog-te-combo {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;

      width: 82px !important;
      height: 30px !important;

      margin: 0 !important;
      padding: 4px 22px 4px 7px !important;

      border: 0 !important;
      border-radius: 7px !important;

      background: transparent !important;
      color: #e2e8f0 !important;

      font-family: 'Inter', sans-serif !important;
      font-size: 12px !important;
      font-weight: 600 !important;

      cursor: pointer !important;
      outline: none !important;

      box-sizing: border-box !important;
      appearance: auto !important;
    }

    /* Dropdown options */
    #google_translate_element .goog-te-combo option {
      background: #0f172a !important;
      color: #f8fafc !important;
    }

    /* Google injected text cleanup */
    .goog-te-gadget {
      font-size: 0 !important;
    }

    .goog-te-gadget img {
      display: none !important;
    }

    /* Hide Google's top translation banner */
    .goog-te-banner-frame {
      display: none !important;
    }

    body {
      top: 0 !important;
    }

    /* Remove Google branding text */
    .goog-logo-link {
      display: none !important;
    }

    .goog-te-gadget .goog-te-combo {
      vertical-align: middle !important;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
